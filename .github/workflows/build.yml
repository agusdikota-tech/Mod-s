name: Build Frame Assist (Android)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Android64
            os: ubuntu-latest
            target: Android64
          - name: Android32
            os: ubuntu-latest
            target: Android32
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          android-ndk-version: 27.3.13750724
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package and publish
    runs-on: ubuntu-latest
    needs: ['build']
    permissions:
      contents: write
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

      - name: Collect .geode
        run: |
          mkdir -p out
          find "${{ steps.build.outputs.build-output }}" -name "*.geode" -exec cp {} out/ \;
          ls -la out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Frame Assist (ultima compilacion)
          files: out/*.geode
